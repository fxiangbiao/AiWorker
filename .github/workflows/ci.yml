name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（build / lint / test）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 类型构建
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: 测试（串行 worker：中断杀树/计时类用例在共享 runner 高并发下抖动）
        run: npx vitest run --pool=forks --poolOptions.forks.minForks=1 --poolOptions.forks.maxForks=1

  web:
    name: Web（svelte-check / build）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 静态检查（svelte-check）
        run: npm run check
      - name: 构建
        run: npm run build
