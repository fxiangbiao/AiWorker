<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiWorker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0B0E14;--surface:#131620;--border:#1E2330;--text:#E2E4E9;--dim:#6B7280;
  --primary:#6366F1;--primary-glow:rgba(99,102,241,.15);--secondary:#818CF8;
  --success:#34D399;--warn:#FBBF24;--error:#F87171;--info:#60A5FA;
  --stream-from:#818CF8;--stream-to:#A78BFA;
  --font-ui:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --radius:8px;--radius-sm:6px;
  --sidebar-w:240px;--right-w:260px;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-ui);font-size:13px;background:var(--bg);color:var(--text);display:flex;flex-direction:column;line-height:1.5}
/* topbar */
#topbar{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:16px;flex-shrink:0}
#topbar .logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--text)}
#topbar .logo .mark{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-family:var(--font-mono)}
#topbar .modes{display:flex;gap:0;background:var(--bg);border-radius:var(--radius);padding:2px}
#topbar .modes button{padding:5px 14px;border:none;border-radius:6px;background:transparent;color:var(--dim);font-family:var(--font-ui);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
#topbar .modes button.active{background:var(--primary);color:#fff;box-shadow:0 0 12px var(--primary-glow)}
#topbar .modes button:hover:not(.active){color:var(--text)}
#topbar select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 10px;font-family:var(--font-ui);font-size:12px;cursor:pointer;outline:none}
#topbar select:focus{border-color:var(--primary)}
#topbar .spacer{flex:1}
#topbar .conn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
#topbar .conn-dot{width:7px;height:7px;border-radius:50%}
#topbar .conn-dot.online{background:var(--success);box-shadow:0 0 6px rgba(52,211,153,.4)}
#topbar .conn-dot.offline{background:var(--error)}
/* layout */
#main{display:flex;flex:1;overflow:hidden}
/* sidebar */
#sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#sidebar .s-top{padding:12px}
#sidebar .s-top button{width:100%;padding:8px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);font-family:var(--font-ui);font-size:12px;font-weight:600;cursor:pointer;transition:box-shadow .2s}
#sidebar .s-top button:hover{box-shadow:0 4px 16px var(--primary-glow)}
#sidebar .s-list{flex:1;overflow-y:auto;padding:0 8px}
#sidebar .s-item{padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:2px;transition:background .15s}
#sidebar .s-item:hover{background:var(--border)}
#sidebar .s-item.active{background:var(--primary-glow);border:1px solid var(--primary);box-shadow:0 0 12px rgba(99,102,241,.08)}
#sidebar .s-item .s-title{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sidebar .s-item .s-meta{font-size:11px;color:var(--dim);margin-top:2px}
#sidebar .s-bottom{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
/* main panel */
#main-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
#msg-list{flex:1;overflow-y:auto;padding:16px 24px;scroll-behavior:smooth}
/* message */
.msg{margin-bottom:20px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg.user{text-align:right}
.msg.user .role-label{font-size:11px;color:var(--dim);font-weight:500;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.msg.user .content{display:inline-block;text-align:left;max-width:75%;background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(129,140,248,.06));border:1px solid rgba(99,102,241,.2);border-radius:12px 12px 4px 12px;padding:10px 14px;font-size:13px}
.msg.agent .role-label{font-size:12px;font-weight:600;color:var(--primary);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.msg.agent .role-label::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--primary);box-shadow:0 0 8px var(--primary-glow)}
.msg.agent .content{padding-left:4px;line-height:1.7;font-size:13px}
.msg.agent .content p{margin:6px 0}
.msg.agent .content pre{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;overflow-x:auto;font-family:var(--font-mono);font-size:12px;position:relative}
.msg.agent .content pre .copy-btn{position:absolute;top:6px;right:6px;background:var(--surface);color:var(--dim);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-family:var(--font-ui);font-size:11px;cursor:pointer;transition:all .15s}
.msg.agent .content pre .copy-btn:hover{color:var(--text);border-color:var(--primary)}
.msg.agent .content code{font-family:var(--font-mono);font-size:12px}
.msg.agent .content :not(pre)>code{background:rgba(99,102,241,.1);color:var(--secondary);padding:2px 5px;border-radius:3px}
.msg.agent .content table{border-collapse:collapse;width:100%;margin:8px 0}
.msg.agent .content td,.msg.agent .content th{border:1px solid var(--border);padding:6px 10px;font-size:12px}
.msg.agent .content th{background:var(--surface);font-weight:600}
/* thinking */
.think-block{margin:8px 0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:rgba(139,92,246,.03)}
.think-block .think-toggle{padding:8px 12px;font-size:12px;color:var(--secondary);cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:500}
.think-block .think-toggle .arrow{font-size:10px;transition:transform .2s;opacity:.7}
.think-block.open .think-toggle .arrow{transform:rotate(90deg)}
.think-block .think-body{display:none;padding:8px 12px 12px;font-size:12px;color:var(--dim);border-top:1px solid var(--border);background:var(--bg);white-space:pre-wrap;max-height:200px;overflow-y:auto}
.think-block.open .think-body{display:block}
/* tool cards */
.tool-card{margin:8px 0;border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;background:var(--bg);transition:all .3s}
.tool-card.executing{border-color:var(--info);animation:toolPulse 2s ease-in-out infinite}
.tool-card.success{border-color:var(--success);box-shadow:0 0 8px rgba(52,211,153,.08)}
.tool-card.error{border-color:var(--error)}
.tool-card .tc-header{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500}
.tool-card .tc-header .tc-icon{font-size:14px}
.tool-card .tc-header .tc-name{color:var(--info)}
.tool-card.success .tc-header .tc-name{color:var(--success)}
.tool-card.error .tc-header .tc-name{color:var(--error)}
.tool-card .tc-args{color:var(--dim);margin-top:4px;font-size:12px;font-family:var(--font-mono);white-space:pre-wrap;word-break:break-all;max-height:48px;overflow-y:auto}
.tool-card .tc-result{margin-top:6px;font-size:12px;color:var(--success)}
.tool-card.error .tc-result{color:var(--error)}
.tool-card .tc-result .diff-link{cursor:pointer;color:var(--secondary);font-weight:500}
.tool-card .tc-result .diff-link:hover{text-decoration:underline}
@keyframes toolPulse{0%,100%{box-shadow:0 0 0 0 rgba(96,165,250,.15)}50%{box-shadow:0 0 0 4px rgba(96,165,250,0)}}
/* streaming glow */
.streaming .content{border:1px solid var(--border);border-image:linear-gradient(135deg,var(--stream-from),var(--stream-to)) 1;animation:streamGlow 3s ease-in-out infinite}
@keyframes streamGlow{0%,100%{border-color:rgba(99,102,241,.2)}50%{border-color:rgba(167,139,250,.4)}}
/* input */
#input-area{padding:12px 24px 16px;flex-shrink:0}
#input-area .input-row{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;transition:border-color .2s}
#input-area .input-row:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
#input-area textarea{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--font-ui);font-size:13px;resize:none;outline:none;min-height:24px;max-height:120px;line-height:1.6;padding:0}
#input-area textarea::placeholder{color:var(--dim)}
#input-area .send-btn{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--primary);color:#fff;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
#input-area .send-btn:hover{box-shadow:0 0 16px var(--primary-glow)}
#input-area .send-btn:disabled{opacity:.3;cursor:default;box-shadow:none}
/* right panel */
#right-panel{width:var(--right-w);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;padding:12px}
#right-panel .rp-section{margin-bottom:16px}
#right-panel .rp-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin-bottom:8px}
#right-panel .diff-file{padding:6px 8px;border-radius:4px;margin-bottom:4px;display:flex;align-items:center;gap:6px;font-size:12px;background:var(--bg);font-family:var(--font-mono)}
#right-panel .diff-file .df-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
#right-panel .diff-file .df-add{color:var(--success);font-weight:500}
#right-panel .diff-file .df-rem{color:var(--error);font-weight:500}
/* status bar */
#statusbar{height:32px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:20px;font-size:11px;color:var(--dim);flex-shrink:0}
#statusbar .sb-item{display:flex;align-items:center;gap:5px}
#statusbar .sb-dot{width:6px;height:6px;border-radius:50%}
#statusbar .sb-dot.model{background:var(--primary);box-shadow:0 0 6px var(--primary-glow)}
#statusbar .sb-dot.tokens{background:var(--warn)}
#statusbar .sb-warn{color:var(--warn)}
/* error */
.error-banner{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;color:var(--error);font-size:12px;font-family:var(--font-mono)}
/* empty */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--dim);gap:16px;text-align:center}
.empty-state .mark-big{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-size:28px;font-family:var(--font-mono);color:#fff;opacity:.4}
.empty-state h2{font-size:16px;font-weight:600;color:var(--text)}
.empty-state p{font-size:12px;max-width:320px}
/* loading indicator */
.typing{margin:8px 0;display:flex;align-items:center;gap:4px}
.typing span{width:5px;height:5px;border-radius:50%;background:var(--primary);animation:typingDot 1.4s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.2s;background:var(--secondary)}
.typing span:nth-child(3){animation-delay:.4s;background:var(--stream-to)}
@keyframes typingDot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-8px);opacity:1}}
/* responsive */
@media(max-width:1024px){#right-panel{display:none}}
@media(max-width:768px){#sidebar{display:none}#msg-list{padding:12px}#input-area{padding:8px 12px 12px}}
</style>
</head>
<body>
<div id="topbar">
  <div class="logo"><div class="mark">A</div>AiWorker</div>
  <div class="modes" id="mode-tabs">
    <button data-mode="ask">Ask</button>
    <button data-mode="plan">Plan</button>
    <button data-mode="craft">Craft</button>
  </div>
  <select id="agent-select"></select>
  <div class="spacer"></div>
  <div class="conn"><div class="conn-dot offline" id="conn-dot"></div><span id="conn-label">离线</span></div>
</div>
<div id="main">
  <div id="sidebar">
    <div class="s-top"><button id="new-chat-btn">+ 新对话</button></div>
    <div class="s-list" id="chat-list"></div>
    <div class="s-bottom" id="sidebar-info">
      <span>model: --</span><span>tokens: 0 / 8000</span><span>cost: ¥0.0000</span>
    </div>
  </div>
  <div id="main-panel">
    <div id="msg-list">
      <div class="empty-state">
        <div class="mark-big">A</div>
        <h2>AiWorker</h2>
        <p>个人 AI Agent 助手 — 多智能体协作 + 流式工具执行</p>
      </div>
    </div>
    <div id="input-area">
      <div class="input-row">
        <textarea id="inp" rows="1" placeholder="输入消息，Enter 发送..." disabled></textarea>
        <button class="send-btn" id="send-btn" disabled>&#9654;</button>
      </div>
    </div>
  </div>
  <div id="right-panel">
    <div class="rp-section"><div class="rp-title">文件变更</div><div id="diff-list"></div></div>
    <div class="rp-section"><div class="rp-title">激活技能</div><div id="skill-list"></div></div>
  </div>
</div>
<div id="statusbar">
  <div class="sb-item"><span class="sb-dot model"></span><span id="sb-model">model: --</span></div>
  <div class="sb-item"><span class="sb-dot tokens"></span><span id="sb-tokens">tokens: 0 / 8000</span></div>
  <span id="sb-cost">cost: ¥0.0000</span>
  <span id="sb-agent" style="margin-left:auto">agent: default</span>
</div>

<script>
marked.setOptions({breaks:true,gfm:true});

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const STATE={mode:'craft',agentId:'default',chatId:null,chats:[],messages:[],sending:false,abort:null,diffs:[]};
const PRICING={prompt:1,completion:2};
let totalTokens=0,currentModel='';

function fmtN(n){return n>=1000?(n/1000).toFixed(1)+'k':String(n)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function loadChats(){try{STATE.chats=JSON.parse(localStorage.getItem('aiworker_chats')||'[]')}catch(e){STATE.chats=[]}}
function saveChats(){localStorage.setItem('aiworker_chats',JSON.stringify(STATE.chats))}
function loadMsgs(id){try{return JSON.parse(localStorage.getItem('aiworker_msgs_'+id)||'[]')}catch(e){return[]}}
function saveMsgs(id,msgs){if(id)localStorage.setItem('aiworker_msgs_'+id,JSON.stringify(msgs))}
function loadSettings(){try{const d=JSON.parse(localStorage.getItem('aiworker_settings')||'{}');if(d.mode)STATE.mode=d.mode;if(d.agentId)STATE.agentId=d.agentId}catch(e){}}
function saveSettings(){localStorage.setItem('aiworker_settings',JSON.stringify({mode:STATE.mode,agentId:STATE.agentId}))}

function renderChatList(){
  $('#chat-list').innerHTML=STATE.chats.map(c=>{
    const cls=c.id===STATE.chatId?'active':'';
    return `<div class="s-item ${cls}" data-cid="${c.id}"><div class="s-title">${esc(c.title)}</div><div class="s-meta">${c.turns||0} 轮 &middot; ${c.agentId||'default'}</div></div>`;
  }).join('');
  $('#chat-list').querySelectorAll('.s-item').forEach(el=>el.addEventListener('click',()=>switchChat(el.dataset.cid)));
}

function switchChat(id){
  if(STATE.abort){STATE.abort.abort();STATE.abort=null}
  STATE.chatId=id;STATE.messages=loadMsgs(id);STATE.diffs=[];renderAll();renderChatList();
}

function newChat(){
  if(STATE.abort){STATE.abort.abort();STATE.abort=null}
  const id='c'+Date.now().toString(36);
  STATE.chats.unshift({id,title:'新对话',agentId:STATE.agentId,turns:0,createdAt:Date.now()});
  STATE.chatId=id;STATE.messages=[];STATE.diffs=[];saveChats();renderAll();renderChatList();
}

function updateStatusBar(){
  const used=totalTokens||0;
  $('#sb-tokens').textContent=`tokens: ${fmtN(used)} / 8000`;
  const pc=(used*(PRICING.prompt+PRICING.completion))/1e6;
  $('#sb-cost').textContent=`cost: ¥${pc.toFixed(4)}`;
  $('#sb-model').textContent=`model: ${currentModel||'--'}`;
  $('#sidebar-info').innerHTML=`<span>model: ${currentModel||'--'}</span><span>tokens: ${fmtN(used)} / 8000</span><span>cost: ¥${pc.toFixed(4)}</span>`;
}

function loadAgents(){
  fetch('/agents').then(r=>r.json()).then(d=>{
    const sel=$('#agent-select');
    sel.innerHTML=(d.agents||[]).map(a=>`<option value="${a.id}" ${a.id===STATE.agentId?'selected':''}>${esc(a.name||a.id)}</option>`).join('');
    sel.addEventListener('change',()=>{STATE.agentId=sel.value;saveSettings()});
    if(!sel.innerHTML)sel.innerHTML='<option value="default">default</option>';
  }).catch(()=>{});
}

function pollStatus(){
  fetch('/status').then(r=>r.json()).then(d=>{
    totalTokens=d.tokenUsage?.total||0;currentModel=d.model;updateStatusBar();
    $('#conn-dot').className='conn-dot online';$('#conn-label').textContent='在线';
  }).catch(()=>{$('#conn-dot').className='conn-dot offline';$('#conn-label').textContent='离线'});
}

function initModes(){
  $$('#mode-tabs button').forEach(b=>{
    if(b.dataset.mode===STATE.mode)b.classList.add('active');
    b.addEventListener('click',()=>{STATE.mode=b.dataset.mode;saveSettings();$$('#mode-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
  });
}

function setInputState(s){
  STATE.sending=s;$('#inp').disabled=s;$('#send-btn').disabled=s;
  $('#inp').placeholder=s?'AiWorker 正在处理...':'输入消息，Enter 发送...';
  if(!s)$('#inp').focus();
}

function scrollBottom(){const el=$('#msg-list');el.scrollTop=el.scrollHeight}

function renderMarkdown(t){try{return marked.parse(t)}catch(e){return esc(t)}}
function renderToolCard(m){
  const cls=m.result?m.error?'error':'success':'executing';
  const icon=m.result?m.error?'&#10007;':'&#10003;':'&#9881;';
  let args='';try{args=typeof m.args==='string'?m.args:JSON.stringify(m.args,null,2)}catch(e){}
  let result='';
  if(m.result&&!m.error)result=`<div class="tc-result">${m.resultPreview?esc(m.resultPreview.slice(0,200)):''}${m.duration?` &middot; ${m.duration}ms`:''}</div>`;
  if(m.error)result=`<div class="tc-result">${esc(m.error)}</div>`;
  if(m.filePath)result+=`<div class="tc-result"><span class="diff-link" data-file="${esc(m.filePath)}">查看变更: ${esc(m.filePath)}</span></div>`;
  return `<div class="tool-card ${cls}"><div class="tc-header"><span class="tc-icon">${icon}</span><span class="tc-name">${esc(m.name||'tool')}</span></div><div class="tc-args">${esc(args)}</div>${result}</div>`;
}

function renderThinkingBlock(text,steps,open){
  return `<div class="think-block ${open?'open':''}"><div class="think-toggle"><span class="arrow">&#9654;</span>思考${steps?` (${steps} 步)`:''}</div><div class="think-body">${esc(text)}</div></div>`;
}

function renderMessages(){
  const el=$('#msg-list');
  if(STATE.messages.length===0){el.innerHTML=`<div class="empty-state"><div class="mark-big">A</div><h2>AiWorker</h2><p>个人 AI Agent 助手 &mdash; 多智能体协作 + 流式工具执行</p></div>`;return}
  let html='';for(const m of STATE.messages){
    if(m.role==='user')html+=`<div class="msg user"><div class="role-label">You</div><div class="content">${esc(m.content)}</div></div>`;
    else if(m.role==='assistant'||m.role==='agent')html+=`<div class="msg agent${!m.content&&STATE.sending?' streaming':''}"><div class="role-label">${esc(m.agentId||'agent')}</div><div class="content">${renderMarkdown(m.content||'')}</div></div>`;
    else if(m.role==='tool_call')html+=renderToolCard(m);
    else if(m.role==='thinking')html+=renderThinkingBlock(m.content||'',m.steps||0,true);
  }
  el.innerHTML=html;scrollBottom();
}
function renderDiffs(){
  const el=$('#diff-list');
  if(STATE.diffs.length===0){el.innerHTML=`<div style="color:var(--dim);font-size:12px">暂无变更</div>`;return}
  el.innerHTML=STATE.diffs.map(d=>{const n=d.filePath.split(/[\\/]/).pop();return `<div class="diff-file"><span class="df-name">${esc(n)}</span><span class="df-add">+${d.added||0}</span><span class="df-rem">−${d.removed||0}</span></div>`}).join('');
}
function renderAll(){renderMessages();renderDiffs();updateStatusBar()}

function addMsg(msg){STATE.messages.push(msg)}
function sendMessage(){
  const inp=$('#inp'),text=inp.value.trim();if(!text||STATE.sending)return;
  inp.value='';inp.style.height='auto';
  if(!STATE.chatId)newChat();
  addMsg({role:'user',content:text});
  const chat=STATE.chats.find(c=>c.id===STATE.chatId);
  if(chat&&(!chat.turns||chat.turns===0)){chat.title=text.slice(0,50);chat.turns=1}else if(chat)chat.turns=(chat.turns||0)+1;
  saveChats();renderAll();renderChatList();scrollBottom();setInputState(true);
  const abort=new AbortController();STATE.abort=abort;
  const agentMsg={role:'assistant',agentId:STATE.agentId,content:''};addMsg(agentMsg);renderAll();scrollBottom();
  let curElement=document.querySelector('.msg.agent:last-of-type .content');

  fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,mode:STATE.mode,agentId:STATE.agentId}),signal:abort.signal})
  .then(async resp=>{
    if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
    const reader=resp.body.getReader();const dec=new TextDecoder();let buf='';
    while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';for(const line of lines){if(!line.startsWith('data: '))continue;try{handleSSE(JSON.parse(line.slice(6)))}catch(e){}}}
  }).catch(e=>{if(e.name!=='AbortError'){const d=document.createElement('div');d.className='error-banner';d.textContent=e.message;$('#msg-list').appendChild(d);scrollBottom()}})
  .finally(()=>{setInputState(false);STATE.abort=null;saveMsgs(STATE.chatId,STATE.messages);pollStatus()});
}

function handleSSE(data){
  switch(data.type){
    case 'thinking':{let last=STATE.messages.filter(m=>m.role==='thinking').pop();if(!last){last={role:'thinking',content:'',steps:0};addMsg(last)}last.content+=data.content||'';last.steps=(last.steps||0)+1;renderAll();scrollBottom();break}
    case 'text':{const last=STATE.messages[STATE.messages.length-1];if(last&&last.role==='assistant'){last.content+=data.content||'';renderAll();scrollBottom()}break}
    case 'tool_call':{addMsg({role:'tool_call',name:data.name,args:data.args,id:data.id});renderAll();scrollBottom();break}
    case 'tool_result':{const tc=STATE.messages.filter(m=>m.role==='tool_call').pop();if(tc){tc.result=true;tc.duration=data.duration;tc.resultPreview=data.summary;if(!data.success)tc.error=data.summary}if(data.filePath)STATE.diffs.push({filePath:data.filePath,added:data.added||0,removed:data.removed||0});renderAll();scrollBottom();break}
    case 'done':{if(data.tokenUsage){totalTokens=data.tokenUsage.total||0;currentModel=data.model}updateStatusBar();break}
    case 'error':{const d=document.createElement('div');d.className='error-banner';d.textContent=data.message;$('#msg-list').appendChild(d);scrollBottom();break}
  }
}

function init(){
  loadSettings();loadChats();
  if(STATE.chats.length>0){STATE.chatId=STATE.chats[0].id;STATE.messages=loadMsgs(STATE.chatId)}
  initModes();loadAgents();renderChatList();renderAll();pollStatus();
  const inp=$('#inp');inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
  inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'});
  $('#send-btn').addEventListener('click',sendMessage);
  $('#new-chat-btn').addEventListener('click',newChat);
  $('#msg-list').addEventListener('click',e=>{
    const tg=e.target.closest('.think-toggle');if(tg){tg.closest('.think-block').classList.toggle('open')}
    const cp=e.target.closest('.copy-btn');if(cp){const pre=cp.closest('pre');if(pre)navigator.clipboard.writeText(pre.textContent.replace(/复制$/,''))}
  });
  setInputState(false);setTimeout(()=>inp.focus(),100);
  setInterval(pollStatus,30000);
}
init();
</script>
