<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiWorker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F9F8F6;--surface:#FFFFFF;--border:#E8E5E0;--text:#1A1A1A;--dim:#8B8682;
  --primary:#D97706;--primary-light:rgba(217,119,6,.08);--hover-bg:#F3F0EC;
  --success:#059669;--warn:#D97706;--error:#DC2626;--info:#2563EB;
  --font-ui:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --radius:10px;--radius-sm:8px;--shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02);
  --sidebar-w:220px;--right-w:240px;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-ui);font-size:13px;background:var(--bg);color:var(--text);display:flex;flex-direction:column;line-height:1.5}
/* topbar */
#topbar{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:16px;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.02);z-index:10}
#topbar .logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--text);letter-spacing:-.2px}
#topbar .logo .mark{width:26px;height:26px;border-radius:7px;background:#D97706;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;font-family:var(--font-mono)}
#topbar .modes{display:flex;gap:4px}
#topbar .modes button{padding:5px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--dim);font-family:var(--font-ui);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
#topbar .modes button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
#topbar .modes button:hover:not(.active){background:var(--hover-bg);color:var(--text)}
#topbar select{padding:6px 10px;border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--text);font-family:var(--font-ui);font-size:12px;cursor:pointer;outline:none}
#topbar select:focus{border-color:var(--primary)}
#topbar .spacer{flex:1}
#topbar .dirs{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--dim)}
#topbar .dirs span{max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .conn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
#topbar .conn-dot{width:7px;height:7px;border-radius:50%}
#topbar .conn-dot.online{background:var(--success)}
#topbar .conn-dot.offline{background:var(--dim)}
/* layout */
#main{display:flex;flex:1;overflow:hidden}
/* sidebar */
#sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#sidebar .s-top{padding:12px}
#sidebar .s-top button{width:100%;padding:9px;background:var(--text);color:#fff;border:none;border-radius:var(--radius-sm);font-family:var(--font-ui);font-size:12px;font-weight:600;cursor:pointer}
#sidebar .s-list{flex:1;overflow-y:auto;padding:0 8px;scrollbar-width:none}
#sidebar .s-list::-webkit-scrollbar{display:none}
#sidebar .s-item{padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:2px;transition:background .1s}
#sidebar .s-item:hover{background:var(--hover-bg)}
#sidebar .s-item.active{background:var(--primary-light);border:1px solid rgba(217,119,6,.15)}
#sidebar .s-item .s-title{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sidebar .s-item .s-meta{font-size:11px;color:var(--dim);margin-top:2px}
/* main panel */
#main-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
#msg-list{flex:1;overflow-y:auto;padding:24px 48px;scroll-behavior:smooth;max-width:960px;margin:0 auto;width:100%;scrollbar-width:none}
#msg-list::-webkit-scrollbar{display:none}
/* message */
.msg{margin-bottom:28px}
.msg.user{margin-bottom:20px}
.msg.user .content{font-size:14px;line-height:1.7;color:var(--text);background:var(--hover-bg);padding:14px 18px;border-radius:var(--radius);display:inline-block;max-width:85%}
.msg.agent-card{margin-bottom:24px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.answer-block{padding:18px 24px;border-top:1px solid var(--border);position:relative}
.answer-block .ab-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.answer-block .ab-copy{background:none;border:none;color:var(--dim);font-family:var(--font-ui);font-size:11px;cursor:pointer;padding:2px 6px;border-radius:6px;user-select:none}
.answer-block .ab-copy:hover{color:var(--primary);background:var(--hover-bg)}
.answer-block .content{font-size:14px;line-height:1.7;color:var(--text)}
.answer-block .content p{margin:8px 0}
.answer-block .content ul,.answer-block .content ol{padding-left:20px;margin:8px 0}
.answer-block .content pre{background:var(--hover-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;overflow-x:auto;font-family:var(--font-mono);font-size:12px;position:relative;margin:8px 0}
.answer-block .content pre .copy-btn{position:absolute;top:8px;right:8px;background:var(--surface);color:var(--dim);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-family:var(--font-ui);font-size:11px;cursor:pointer}
.answer-block .content pre .copy-btn:hover{color:var(--text);border-color:var(--primary)}
.answer-block .content code{font-family:var(--font-mono);font-size:12px}
.answer-block .content :not(pre)>code{background:var(--primary-light);color:var(--primary);padding:2px 5px;border-radius:4px}
.answer-block .content table{border-collapse:collapse;width:100%;margin:8px 0}
.answer-block .content td,.answer-block .content th{border:1px solid var(--border);padding:6px 10px;font-size:12px}
.answer-block .content th{background:var(--hover-bg);font-weight:600}
/* thinking */
.think-block{margin:0;border:none;border-bottom:1px solid var(--border);border-left:3px solid #A78BFA;overflow:hidden;background:transparent}
.think-block .think-toggle{padding:10px 18px;font-size:12px;color:#7C3AED;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:500}
.think-block .think-toggle .arrow{font-size:10px;transition:transform .2s}
.think-block.open .think-toggle .arrow{transform:rotate(90deg)}
.think-block .think-body{display:none;padding:12px 18px 14px;font-size:12px;color:var(--dim);border-top:1px solid var(--border);white-space:pre-wrap;max-height:200px;overflow-y:auto;scrollbar-width:none}
.think-block .think-body::-webkit-scrollbar{display:none}
.think-block.open .think-body{display:block}
/* tool cards */
.tools-group{margin:0 0 4px 0;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.tools-group .tools-toggle{padding:8px 14px;font-size:11px;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:4px;user-select:none}
.tools-group .tools-toggle .arrow{font-size:10px;transition:transform .2s}
.tools-group.open .tools-toggle .arrow{transform:rotate(90deg)}
.tools-group .tools-body{display:none}
.tools-group.open .tools-body{display:block}
.tool-card{margin:0;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:8px 14px;background:var(--surface);box-shadow:none}
.tool-card:last-child{border-bottom:none}
.tool-card .tc-header{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--dim)}
.tool-card .tc-header .tc-icon{font-size:13px}
.tool-card .tc-args{color:var(--dim);margin-top:4px;font-size:12px;font-family:var(--font-mono);white-space:pre-wrap;word-break:break-all;max-height:48px;overflow-y:auto;scrollbar-width:none}
.tool-card .tc-args::-webkit-scrollbar{display:none}
.tool-card .tc-result{margin-top:6px;font-size:12px;color:var(--success);font-weight:500}
.tool-card.error .tc-result{color:var(--error)}
.tool-card .tc-result .diff-link{cursor:pointer;color:var(--primary);font-weight:500;text-decoration:underline;text-underline-offset:2px}
/* spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
.live-label{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border)}
/* iteration separator */
.iter-sep{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:11px;color:var(--dim)}
.iter-sep::before,.iter-sep::after{content:'';flex:1;height:1px;background:var(--border)}
/* input */
#input-area{padding:16px 48px 20px;flex-shrink:0}
#input-area .input-row{display:flex;align-items:flex-end;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
#input-area .input-row:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(217,119,6,.1)}
#input-area textarea{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--font-ui);font-size:14px;resize:none;outline:none;min-height:24px;max-height:120px;line-height:1.6;padding:0}
#input-area textarea::placeholder{color:var(--dim)}
#input-area .send-btn{width:34px;height:34px;border-radius:50%;background:var(--text);color:#fff;border:none;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
#input-area .send-btn:hover{background:var(--primary)}
#input-area .send-btn:disabled{opacity:.3;cursor:default}
/* right panel */
#right-panel{width:var(--right-w);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;padding:16px;scrollbar-width:none}
#right-panel::-webkit-scrollbar{display:none}
#right-panel .rp-section{margin-bottom:20px}
#right-panel .rp-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:8px}
#right-panel .diff-file{padding:6px 10px;border-radius:6px;margin-bottom:4px;display:flex;align-items:center;gap:6px;font-size:12px;background:var(--bg);font-family:var(--font-mono);border:1px solid var(--border)}
#right-panel .diff-file .df-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
#right-panel .diff-file .df-add{color:var(--success);font-weight:600}
#right-panel .diff-file .df-rem{color:var(--error);font-weight:600}
/* status bar */
#statusbar{height:30px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:20px;font-size:11px;color:var(--dim);flex-shrink:0}
#statusbar .sb-item{display:flex;align-items:center;gap:5px}
/* error */
.error-banner{background:#FEF2F2;border:1px solid #FECACA;border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;color:var(--error);font-size:12px;font-family:var(--font-mono)}
/* empty */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--dim);gap:12px;text-align:center}
.empty-state .mark-big{font-size:40px;opacity:.15}
.empty-state h2{font-size:18px;font-weight:600;color:var(--text)}
.empty-state p{font-size:13px;max-width:340px;color:var(--dim);line-height:1.6}
/* responsive */
@media(max-width:1024px){#right-panel{display:none}}
@media(max-width:768px){#sidebar{display:none}#msg-list{padding:16px}#input-area{padding:12px 16px 16px}}
</style>
</head>
<body>
<div id="topbar">
  <div class="logo"><div class="mark">A</div>AiWorker</div>
  <div class="modes" id="mode-tabs">
    <button data-mode="ask">Ask</button>
    <button data-mode="plan">Plan</button>
    <button data-mode="craft">Craft</button>
  </div>
  <select id="agent-select"></select>
  <div class="dirs"><span id="dir-work" title="工作目录">--</span><span id="dir-out" title="输出目录">--</span></div>
  <div class="spacer"></div>
  <div class="conn"><div class="conn-dot offline" id="conn-dot"></div><span id="conn-label">离线</span></div>
</div>
<div id="main">
  <div id="sidebar">
    <div class="s-top"><button id="new-chat-btn">+ 新对话</button></div>
    <div class="s-list" id="chat-list"></div>
  </div>
  <div id="main-panel">
    <div id="msg-list">
      <div class="empty-state">
        <div class="mark-big">&#9670;</div>
        <h2>AiWorker</h2>
        <p>个人 AI Agent 助手 — 多智能体协作 + 流式工具执行</p>
      </div>
    </div>
    <div id="input-area">
      <div class="input-row">
        <textarea id="inp" rows="1" placeholder="输入消息，Enter 发送..." disabled></textarea>
        <button class="send-btn" id="send-btn" disabled>&#8593;</button>
      </div>
    </div>
  </div>
  <div id="right-panel">
    <div class="rp-section"><div class="rp-title">文件变更</div><div id="diff-list"></div></div>
    <div class="rp-section"><div class="rp-title">技能</div><div id="skill-list"></div></div>
  </div>
</div>
<div id="statusbar">
  <div class="sb-item"><span id="sb-model">model: --</span></div>
  <div class="sb-item"><span id="sb-tokens">tokens: 0</span></div>
  <span id="sb-cost">cost: ¥0.0000</span>
  <span id="sb-agent" style="margin-left:auto">agent: default</span>
</div>

<script>
marked.setOptions({breaks:true,gfm:true,highlight:(code,lang)=>{try{return hljs.highlight(code,{language:lang||'plaintext'}).value}catch(e){return esc(code)}}});
function renderMarkdown(t){try{return marked.parse(t).replace(/<a /g,'<a target="_blank" rel="noopener" ')}catch(e){return esc(t)}}
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const STATE={mode:'craft',agentId:'default',chatId:null,chats:[],messages:[],sending:false,abort:null,diffs:[]};
const PRICING={prompt:1,completion:2};
let totalTokens=0,currentModel='',workingDir='',projectDir='';
function fmtN(n){return n>=1000?(n/1000).toFixed(1)+'k':String(n)}
function basename(p){if(!p)return'';const s=p.replace(/[\\/]+$/,'').split(/[\\/]/);return s[s.length-1]||p}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function loadChats(){try{STATE.chats=JSON.parse(localStorage.getItem('aiworker_chats')||'[]')}catch(e){STATE.chats=[]}}
function saveChats(){localStorage.setItem('aiworker_chats',JSON.stringify(STATE.chats))}
function loadMsgs(id){try{return JSON.parse(localStorage.getItem('aiworker_msgs_'+id)||'[]')}catch(e){return[]}}
function saveMsgs(id,msgs){if(id)localStorage.setItem('aiworker_msgs_'+id,JSON.stringify(msgs))}
function loadSettings(){try{const d=JSON.parse(localStorage.getItem('aiworker_settings')||'{}');if(d.mode)STATE.mode=d.mode;if(d.agentId)STATE.agentId=d.agentId}catch(e){}}
function saveSettings(){localStorage.setItem('aiworker_settings',JSON.stringify({mode:STATE.mode,agentId:STATE.agentId}))}
function renderChatList(){
  $('#chat-list').innerHTML=STATE.chats.map(c=>{
    const cls=c.id===STATE.chatId?'active':'';
    return `<div class="s-item ${cls}" data-cid="${c.id}"><div class="s-title">${esc(c.title)}</div><div class="s-meta">${c.turns||0} 轮 &middot; ${c.agentId||'default'}</div></div>`;
  }).join('');
  $('#chat-list').querySelectorAll('.s-item').forEach(el=>el.addEventListener('click',()=>switchChat(el.dataset.cid)));
}
function switchChat(id){if(STATE.abort){STATE.abort.abort();STATE.abort=null}STATE.chatId=id;STATE.messages=loadMsgs(id);STATE.diffs=[];renderAll();renderChatList()}
function newChat(){if(STATE.abort){STATE.abort.abort();STATE.abort=null}const id='c'+Date.now().toString(36);STATE.chats.unshift({id,title:'新对话',agentId:STATE.agentId,turns:0,createdAt:Date.now()});STATE.chatId=id;STATE.messages=[];STATE.diffs=[];saveChats();renderAll();renderChatList()}
function updateStatusBar(){
  const used=totalTokens||0;$('#sb-tokens').textContent=`tokens: ${fmtN(used)}`;
  const pc=(used*(PRICING.prompt+PRICING.completion))/1e6;$('#sb-cost').textContent=`cost: ¥${pc.toFixed(4)}`;
  $('#sb-model').textContent=`model: ${currentModel||'--'}`;
  $('#dir-work').textContent='💻 '+(basename(workingDir)||'--');$('#dir-work').title='工作目录: '+(workingDir||'--');
  $('#dir-out').textContent='📤 '+(basename(projectDir)||'--');$('#dir-out').title='输出目录: '+(projectDir||'--');
}
function loadAgents(){
  fetch('/agents').then(r=>r.json()).then(d=>{
    const sel=$('#agent-select');sel.innerHTML=(d.agents||[]).map(a=>`<option value="${a.id}" ${a.id===STATE.agentId?'selected':''}>${esc(a.name||a.id)}</option>`).join('');
    sel.addEventListener('change',()=>{STATE.agentId=sel.value;saveSettings()});if(!sel.innerHTML)sel.innerHTML='<option value="default">default</option>';
  }).catch(()=>{});
}
function pollStatus(){
  fetch('/status').then(r=>r.json()).then(d=>{totalTokens=d.tokenUsage?.total||0;currentModel=d.model;workingDir=d.workingDir||'';projectDir=d.projectDir||'';updateStatusBar();$('#conn-dot').className='conn-dot online';$('#conn-label').textContent='在线';if(d.skills&&d.skills.length>0)$('#skill-list').innerHTML=d.skills.map(s=>`<div style="font-size:12px;padding:2px 0">&#9670; ${esc(s)}</div>`).join('');else $('#skill-list').innerHTML='<div style="color:var(--dim);font-size:12px">暂无技能</div>'}).catch(()=>{$('#conn-dot').className='conn-dot offline';$('#conn-label').textContent='离线'});
}
function initModes(){
  $$('#mode-tabs button').forEach(b=>{if(b.dataset.mode===STATE.mode)b.classList.add('active');
  b.addEventListener('click',()=>{STATE.mode=b.dataset.mode;saveSettings();$$('#mode-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')})});
}
function setInputState(s){STATE.sending=s;$('#inp').disabled=s;$('#send-btn').disabled=s;$('#inp').placeholder=s?'AiWorker 正在处理...':'输入消息，Enter 发送...';if(!s)$('#inp').focus()}
function scrollBottom(){const el=$('#msg-list');el.scrollTop=el.scrollHeight}
function renderTimeline(timeline){
  let html='',i=0;
  while(i<timeline.length){
    const t=timeline[i];
    if(t.type==='thinking'){
      html+=`<div class="think-block${t.open?' open':''}" onclick="this.classList.toggle('open')"><div class="think-toggle"><span class="arrow">&#9654;</span>思考</div><div class="think-body">${esc(t.content)}</div></div>`;
      i++;
    }else{
      let group=[],j=i;
      while(j<timeline.length&&timeline[j].type==='tool'){group.push(timeline[j]);j++}
      if(group.length===1){
        html+=renderToolCard(group[0]);
      }else{
        html+=`<div class="tools-group"><div class="tools-toggle" onclick="this.parentElement.classList.toggle('open')"><span class="arrow">&#9654;</span>工具调用 (${group.length})</div><div class="tools-body">${group.map(t=>renderToolCard(t)).join('')}</div></div>`;
      }
      i=j;
    }
  }
  return html;
}
function renderToolCard(m){
  const cls=m.result?m.error?'error':'':'';
  let args='';try{args=typeof m.args==='string'?m.args:JSON.stringify(m.args,null,2)}catch(e){}
  let result='';
  if(m.pending&&!m.result)result=`<div class="tc-result" style="color:var(--dim)"><span class="spin"></span>执行中...</div>`;
  else if(m.result&&!m.error)result=`<div class="tc-result">${m.resultPreview?esc(m.resultPreview.slice(0,200)):''}${m.duration?` &middot; ${m.duration}ms`:''}</div>`;
  if(m.error)result=`<div class="tc-result" style="color:var(--error)">${esc(m.error)}</div>`;
  return `<div class="tool-card ${cls}"><div class="tc-header"><span class="tc-icon">&#9881;</span> ${esc(m.name||'tool')}</div><div class="tc-args">${esc(args)}</div>${result}</div>`;
}
function renderMessages(){
  const el=$('#msg-list');
  if(STATE.messages.length===0){el.innerHTML=`<div class="empty-state"><div class="mark-big">&#9670;</div><h2>AiWorker</h2><p>个人 AI Agent 助手 &mdash; 多智能体协作 + 流式工具执行</p></div>`;return}
  let html='';for(const m of STATE.messages){
    if(m.role==='user')html+=`<div class="msg user"><div class="content">${esc(m.content)}</div></div>`;
    else if(m.role==='assistant'||m.role==='agent'){
      html+=`<div class="msg agent-card">`;
      if(m.timeline&&m.timeline.length>0)html+=`<div class="timeline">${renderTimeline(m.timeline)}</div>`;
      if(m.content)html+=`<div class="answer-block"><div class="ab-top"><span class="ab-label" style="font-size:11px;color:var(--dim)">回答</span><button class="ab-copy" onclick="copyAnswer(this)" data-md="${encodeURIComponent(m.content)}" title="复制原始 Markdown">⧉ 复制</button></div><div class="content">${renderMarkdown(m.content)}</div></div>`;
      html+=`</div>`;
    }
  }
  el.innerHTML=html;scrollBottom();
}
function copyAnswer(btn){
  const raw=decodeURIComponent(btn.getAttribute('data-md')||'');
  const done=()=>{const old=btn.textContent;btn.textContent='✓ 已复制';setTimeout(()=>{btn.textContent=old},1500)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(raw).then(done).catch(()=>{fallbackCopy(raw);done()})}
  else{fallbackCopy(raw);done()}
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);
}
function renderDiffs(){
  const el=$('#diff-list');if(STATE.diffs.length===0){el.innerHTML=`<div style="color:var(--dim);font-size:12px">暂无变更</div>`;return}
  el.innerHTML=STATE.diffs.map(d=>{const n=d.filePath.split(/[\\/]/).pop();return `<div class="diff-file"><span class="df-name">${esc(n)}</span><span class="df-add">+${d.added||0}</span><span class="df-rem">−${d.removed||0}</span></div>`}).join('');
}
function renderAll(){
  document.querySelectorAll('.think-block.open').forEach(el=>{const tl=el.closest('.timeline');const agents=STATE.messages.filter(m=>m.role==='assistant');if(tl&&agents.length){const idx=[...tl.children].indexOf(el);const tm=agents[agents.length-1].timeline;if(tm){let ti=0;for(let j=0;j<idx;j++){if(tm[ti]&&tm[ti].type==='tool'){while(tm[ti]&&tm[ti].type==='tool')ti++;}else ti++}if(tm[ti])tm[ti].open=true}}});
  renderMessages();renderDiffs();updateStatusBar();
}
function addMsg(msg){STATE.messages.push(msg)}
function sendMessage(){
  const inp=$('#inp'),text=inp.value.trim();if(!text||STATE.sending)return;inp.value='';inp.style.height='auto';
  if(!STATE.chatId)newChat();addMsg({role:'user',content:text});
  const chat=STATE.chats.find(c=>c.id===STATE.chatId);if(chat&&(!chat.turns||chat.turns===0)){chat.title=text.slice(0,50);chat.turns=1}else if(chat)chat.turns=(chat.turns||0)+1;
  saveChats();renderAll();renderChatList();scrollBottom();setInputState(true);
  const abort=new AbortController();STATE.abort=abort;
  addMsg({role:'assistant',agentId:STATE.agentId,content:''});renderAll();scrollBottom();
  fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,mode:STATE.mode,agentId:STATE.agentId}),signal:abort.signal})
  .then(async resp=>{if(!resp.ok)throw new Error(`HTTP ${resp.status}`);const reader=resp.body.getReader();const dec=new TextDecoder();let buf='';while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';for(const line of lines){if(!line.startsWith('data: '))continue;try{handleSSE(JSON.parse(line.slice(6)))}catch(e){}}}})
  .catch(e=>{if(e.name!=='AbortError'){const d=document.createElement('div');d.className='error-banner';d.textContent=e.message;$('#msg-list').appendChild(d);scrollBottom()}})
  .finally(()=>{setInputState(false);STATE.abort=null;saveMsgs(STATE.chatId,STATE.messages);pollStatus()});
}
let _rafId=null;
function _flushText(){
  const agent=STATE.messages.filter(m=>m.role==='assistant').pop();
  const el=$('#msg-list').querySelector('.agent-card:last-child .answer-block .content');
  if(el&&agent)el.innerHTML=renderMarkdown(agent.content);
  _rafId=null;
}
function _flushThinking(){
  const agent=STATE.messages.filter(m=>m.role==='assistant').pop();
  if(!agent||!agent.timeline)return;
  const lastT=agent.timeline.filter(t=>t.type==='thinking').pop();
  const body=$('#msg-list').querySelector('.agent-card:last-child .think-block:last-of-type .think-body');
  if(body&&lastT)body.textContent=lastT.content;
}
function _rebuildLastTimeline(){
  const agent=STATE.messages.filter(m=>m.role==='assistant').pop();
  const card=$('#msg-list').querySelector('.agent-card:last-child');
  if(!card||!agent)return;
  const tlEl=card.querySelector('.timeline');
  const open={};card.querySelectorAll('.think-block.open').forEach(el=>open[[...el.parentElement.children].indexOf(el)]=true);
  if(tlEl||agent.timeline){
    let html='';
    if(!tlEl){html='<div class="timeline">';card.insertBefore(document.createElement('div'),card.firstChild)}
    const tEl=card.querySelector('.timeline');if(!tEl)return;
    let i=0;
    while(i<(agent.timeline||[]).length){
      const t=agent.timeline[i];
      if(t.type==='thinking'){
        html+=`<div class="think-block${open[i]?' open':''}" onclick="this.classList.toggle('open')"><div class="think-toggle"><span class="arrow">&#9654;</span>思考</div><div class="think-body">${esc(t.content||'')}</div></div>`;
        i++;
      }else{
        let group=[],j=i;
        while(j<agent.timeline.length&&agent.timeline[j].type==='tool'){group.push(agent.timeline[j]);j++}
        if(group.length===1){
          html+=renderToolCard(group[0]);
        }else{
          html+=`<div class="tools-group"><div class="tools-toggle" onclick="this.parentElement.classList.toggle('open')"><span class="arrow">&#9654;</span>工具调用 (${group.length})</div><div class="tools-body">${group.map(t=>renderToolCard(t)).join('')}</div></div>`;
        }
        i=j;
      }
    }
    tEl.innerHTML=html;
  }
  const ansEl=card.querySelector('.answer-block .content');
  if(ansEl&&agent.content)ansEl.innerHTML=renderMarkdown(agent.content);
}
function handleSSE(data){
  switch(data.type){
    case 'thinking_start':{
      const card=$('#msg-list').querySelector('.agent-card:last-child');
      if(card&&!card._thinkingLabel){
        const label=document.createElement('div');
        label.className='live-label';label._thinkingLabel=true;
        label.innerHTML='<span class="spin"></span>思考中...';
        card.insertBefore(label,card.firstChild);card._thinkingLabel=true;
      }
      scrollBottom();break;
    }
    case 'thinking':{
      const agent=STATE.messages.filter(m=>m.role==='assistant').pop();if(!agent)break;
      agent.timeline=agent.timeline||[];
      const last=agent.timeline[agent.timeline.length-1];
      if(last&&last.type==='thinking'){last.content+=(data.content||'')}else{agent.timeline.push({type:'thinking',content:data.content||'',open:false})}
      const card=$('#msg-list').querySelector('.agent-card:last-child');
      if(card&&card._thinkingLabel){const lb=card.querySelector('.live-label');if(lb)lb.remove();card._thinkingLabel=false}
      _rebuildLastTimeline();_flushThinking();scrollBottom();break;
    }
    case 'text':{
      const agent=STATE.messages.filter(m=>m.role==='assistant').pop();if(agent){agent.content+=data.content||'';if(!_rafId)_rafId=requestAnimationFrame(_flushText)}scrollBottom();break;
    }
    case 'tool_call':{
      const agent=STATE.messages.filter(m=>m.role==='assistant').pop();if(!agent)break;agent.timeline=agent.timeline||[];
      agent.timeline.push({type:'tool',name:data.name,args:data.args,id:data.id,result:false,pending:true});
      _rebuildLastTimeline();scrollBottom();break;
    }
    case 'tool_result':{
      const agent=STATE.messages.filter(m=>m.role==='assistant').pop();if(!agent||!agent.timeline)break;
      for(let i=agent.timeline.length-1;i>=0;i--){const t=agent.timeline[i];if(t.type==='tool'&&!t.result){t.result=true;t.duration=data.duration;t.resultPreview=data.summary;t.toolName=data.name;t.pending=false;if(!data.success)t.error=data.summary;if(data.name==='fs_write')try{const a=JSON.parse(t.args||'{}');if(a.filePath){STATE.diffs.push({filePath:a.filePath,added:0,removed:0});renderDiffs()}}catch(e){}break}}
      _rebuildLastTimeline();scrollBottom();break;
    }
    case 'iteration':{
      const card=$('#msg-list').querySelector('.agent-card:last-child');
      if(card){const sep=document.createElement('div');sep.className='iter-sep';sep.textContent=`Iteration ${data.iteration}`;card.appendChild(sep)}
      break;
    }
    case 'diff':{
      const exist=STATE.diffs.find(d=>d.filePath===data.filePath);if(!exist){STATE.diffs.push({filePath:data.filePath,added:0,removed:0});renderDiffs()}
      break;
    }
    case 'done':{
      if(data.tokenUsage){totalTokens=data.tokenUsage.total||0;currentModel=data.model}renderAll();break;
    }
    case 'error':{
      const d=document.createElement('div');d.className='error-banner';d.textContent=data.message;$('#msg-list').appendChild(d);scrollBottom();break;
    }
  }
}
function init(){
  loadSettings();loadChats();if(STATE.chats.length>0){STATE.chatId=STATE.chats[0].id;STATE.messages=loadMsgs(STATE.chatId)}
  initModes();loadAgents();renderChatList();renderAll();pollStatus();
  const inp=$('#inp');inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
  inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'});
  $('#send-btn').addEventListener('click',sendMessage);$('#new-chat-btn').addEventListener('click',newChat);
  $('#msg-list').addEventListener('click',e=>{const cp=e.target.closest('.copy-btn');if(cp){const pre=cp.closest('pre');if(pre)navigator.clipboard.writeText(pre.textContent.replace(/复制$/,''))}});
  setInputState(false);setTimeout(()=>inp.focus(),100);setInterval(pollStatus,30000);
}
init();
</script>
</body>
