<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌊 大海 · 潮汐 · 落日</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1026; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  #scene { display: block; width: 100vw; height: 100vh; cursor: pointer; }

  /* 右下角信息面板 */
  #panel {
    position: fixed; right: 16px; bottom: 16px;
    background: rgba(10, 15, 35, 0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 200, 120, 0.25);
    border-radius: 14px;
    padding: 12px 18px;
    color: #ffe9c9;
    font-size: 13px;
    line-height: 1.9;
    user-select: none;
    pointer-events: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    min-width: 175px;
  }
  #panel .title { font-size: 14px; font-weight: 600; letter-spacing: 1px; margin-bottom: 4px; }
  #panel .row { display: flex; gap: 8px; align-items: center; }
  #panel .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* 顶部提示 */
  #hint {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    color: rgba(255, 235, 200, 0.9);
    font-size: 13px; letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    user-select: none; pointer-events: none;
    background: rgba(0,0,0,0.22);
    padding: 7px 20px; border-radius: 999px;
    backdrop-filter: blur(4px);
    white-space: nowrap; text-align: center;
    transition: opacity 0.3s;
  }

  /* 左下角视角徽章 */
  #viewBadge {
    position: fixed; left: 16px; bottom: 16px;
    background: rgba(10, 15, 35, 0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(127, 212, 255, 0.25);
    border-radius: 999px;
    padding: 8px 16px;
    color: #d8f2ff;
    font-size: 13px;
    letter-spacing: 1px;
    user-select: none; pointer-events: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  }
  #viewBadge.pop { transform: scale(1.18); border-color: rgba(255,215,130,0.9); background: rgba(40,35,60,0.8); }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hint">🌅 大海 · 潮汐 · 落日 — 单击切换视角 · 双击切换速度</div>

  <div id="viewBadge">📷 全景远眺</div>

  <div id="panel">
    <div class="title">🌊 实时观测</div>
    <div class="row"><span class="dot" style="background:#ffb347"></span> 太阳高度：<span id="vSun">0°</span></div>
    <div class="row"><span class="dot" style="background:#7fd4ff"></span> 潮汐状态：<span id="vTide">—</span></div>
    <div class="row"><span class="dot" style="background:#ff8a5c"></span> 水位高度：<span id="vLevel">—</span></div>
    <div class="row"><span class="dot" style="background:#b8f0ff"></span> 时间流速：<span id="vSpeed">1x</span></div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  const elSun   = document.getElementById('vSun');
  const elTide  = document.getElementById('vTide');
  const elLevel = document.getElementById('vLevel');
  const elSpeed = document.getElementById('vSpeed');
  const elView  = document.getElementById('viewBadge');
  const elHint  = document.getElementById('hint');

  /* ================= 全局状态 ================= */
  let t = 0;                 // 全局时间(秒)
  let speed = 1;             // 时间流速
  const TIDE_PERIOD   = 20;  // 一个完整涨落周期(秒) —— 肉眼可见
  const SUNSET_DURATION = 70;// 太阳从顶点到落山(秒)

  // 三种视角（点击循环切换，平滑过渡）—— 海面占比均较大，差异明显
  const VIEWS = [
    { name: '全景远眺', horizon: 0.48, beachF: 0.34, zoom: 1.0,  sunX: 0.70, bob: 0.5 },
    { name: '海岸中景', horizon: 0.36, beachF: 0.36, zoom: 1.6,  sunX: 0.62, bob: 1.6 },
    { name: '近岸特写', horizon: 0.22, beachF: 0.40, zoom: 2.8,  sunX: 0.55, bob: 3.2 },
  ];
  let viewIndex = 0;   // 目标视角
  let viewT = 0;       // 当前过渡值（平滑插值用）

  function sunPhase()  { return ((t / SUNSET_DURATION) % 1 + 1) % 1; }
  function tideLevel() { return 0.5 + 0.5 * Math.sin((t / TIDE_PERIOD) * Math.PI * 2); }

  function tideLabel(l) {
    if (l > 0.93) return '🌕 高潮';
    if (l > 0.70) return '⬆ 涨潮中';
    if (l < 0.07) return '🌑 低潮';
    if (l < 0.30) return '⬇ 退潮中';
    return l >= 0.5 ? '↗ 涨潮' : '↘ 退潮';
  }

  // 当前插值后的视角
  function currentView() {
    const i = Math.min(VIEWS.length - 1, Math.floor(viewT));
    const k = viewT - i;
    const a = VIEWS[i], b = VIEWS[Math.min(VIEWS.length - 1, i + 1)];
    return {
      name: a.name,
      horizon: a.horizon + (b.horizon - a.horizon) * k,
      beachF:  a.beachF  + (b.beachF  - a.beachF)  * k,
      zoom:    a.zoom    + (b.zoom    - a.zoom)    * k,
      sunX:    a.sunX    + (b.sunX    - a.sunX)    * k,
      bob:     a.bob     + (b.bob     - a.bob)     * k,
    };
  }

  /* ================= 尺寸 ================= */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ================= 交互 ================= */
  // 点击涟漪反馈
  const ripples = [];
  let clickTimer = null;

  canvas.addEventListener('click', (e) => {
    const x = e.clientX, y = e.clientY;
    // 点击瞬间弹出涟漪（即时视觉反馈）
    ripples.push({ x, y, r: 6, max: Math.min(W, H) * 0.16, a: 0.65 });

    if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; toggleSpeed(); }
    else clickTimer = setTimeout(() => { clickTimer = null; nextView(); }, 240);
  });

  function nextView() {
    viewIndex = (viewIndex + 1) % VIEWS.length;
    flashHint('📷 视角：' + VIEWS[viewIndex].name);
    // 徽章弹跳反馈
    elView.classList.remove('pop');
    void elView.offsetWidth;           // 强制 reflow 以重启动画
    elView.classList.add('pop');
    setTimeout(() => elView.classList.remove('pop'), 300);
  }
  function toggleSpeed() {
    speed = speed === 1 ? 8 : 1;
    flashHint(speed === 1 ? '⏩ 恢复正常速度' : '🚀 8x 快进中');
    elSpeed.textContent = speed + 'x';
  }
  function flashHint(msg) {
    elHint.textContent = msg;
    clearTimeout(elHint._tm);
    elHint._tm = setTimeout(() => {
      elHint.textContent = '🌅 大海 · 潮汐 · 落日 — 单击切换视角 · 双击切换速度';
    }, 1800);
  }

  /* ================= 工具函数 ================= */
  // 颜色解析：支持 #rrggbb 与 rgb(r,g,b) / rgba(r,g,b,a) —— 修复 NaN 的关键
  function parseColor(c) {
    if (!c) return [0, 0, 0];
    c = String(c).trim();
    if (c[0] === '#') {
      if (c.length === 4) { // 短格式 #rgb
        return [
          parseInt(c[1] + c[1], 16),
          parseInt(c[2] + c[2], 16),
          parseInt(c[3] + c[3], 16)
        ];
      }
      return [
        parseInt(c.slice(1, 3), 16),
        parseInt(c.slice(3, 5), 16),
        parseInt(c.slice(5, 7), 16)
      ];
    }
    const m = c.match(/\d+(\.\d+)?/g);
    if (!m) return [0, 0, 0];
    return [Number(m[0]), Number(m[1]), Number(m[2])].map(v => isFinite(v) ? v : 0);
  }
  // 混合两个颜色（hex 或 rgb 均可），返回 rgb() 字符串 —— 修复 NaN 的关键
  function mixHex(a, b, k) {
    const ca = parseColor(a), cb = parseColor(b);
    const r = Math.round(ca[0] + (cb[0] - ca[0]) * k);
    const g = Math.round(ca[1] + (cb[1] - ca[1]) * k);
    const bl = Math.round(ca[2] + (cb[2] - ca[2]) * k);
    return 'rgb(' + (isFinite(r) ? r : 0) + ',' + (isFinite(g) ? g : 0) + ',' + (isFinite(bl) ? bl : 0) + ')';
  }
  const lerp = (a, b, k) => a + (b - a) * k;

  // 叠加正弦波，生成起伏
  function waveY(x, tt, amp, freq, spd, n, ph) {
    let y = 0;
    for (let k = 1; k <= n; k++) y += Math.sin(x * freq * k + tt * spd * k + ph * k) * amp / k;
    return y;
  }

  /* ================= 粒子 ================= */
  const stars = [];
  for (let i = 0; i < 140; i++) stars.push({ x: Math.random(), y: Math.random() * 0.55, r: Math.random() * 1.3 + 0.3, tw: Math.random() * 6.28, sp: Math.random() * 2 + 0.5 });

  const clouds = [];
  for (let i = 0; i < 8; i++) clouds.push({ x: Math.random() * 1.6 - 0.3, y: 0.05 + Math.random() * 0.36, w: 130 + Math.random() * 220, sp: 8 + Math.random() * 14, drift: Math.random() < 0.5 ? -1 : 1, o: 0.3 + Math.random() * 0.4 });

  const birds = [];
  for (let i = 0; i < 9; i++) birds.push({ x: Math.random(), y: 0.10 + Math.random() * 0.28, sp: 20 + Math.random() * 30, amp: 6 + Math.random() * 9, fr: 2.5 + Math.random() * 2.5, ph: Math.random() * 6.28, s: 0.6 + Math.random() * 0.7 });

  const sparks = [];
  for (let i = 0; i < 90; i++) sparks.push({ x: Math.random(), y: Math.random() * 0.9 + 0.05, s: Math.random() * 1.6 + 0.5, ph: Math.random() * 10 });

  const foams = [];  // 拍岸泡沫

  /* ================= 绘制 ================= */

  // ---- 天空 ----
  function drawSky(ph, horizonY) {
    const stops = [
      [0.00, '#2e7dd1', '#6fb7e8', '#b8e3f0'],
      [0.22, '#4a6fb0', '#d98a4a', '#ffb45e'],
      [0.50, '#3b3a6b', '#c85a3a', '#ff9a4d'],
      [0.75, '#1c1a3a', '#7a3a5e', '#f0623c'],
      [1.00, '#0a0d22', '#202a4a', '#3a2f55'],
    ];
    function sample(p) {
      for (let i = 0; i < stops.length - 1; i++) {
        const [p1, t1, m1, h1] = stops[i], [p2, t2, m2, h2] = stops[i + 1];
        if (p >= p1 && p <= p2) {
          const k = p1 === p2 ? 0 : (p - p1) / (p2 - p1);
          return [mixHex(t1, t2, k), mixHex(m1, m2, k), mixHex(h1, h2, k)];
        }
      }
      const last = stops[stops.length - 1];
      return [last[1], last[2], last[3]];
    }
    const [top, mid, bot] = sample(ph);
    const g = ctx.createLinearGradient(0, 0, 0, horizonY);
    g.addColorStop(0, top);
    g.addColorStop(0.45, mid);
    g.addColorStop(1, bot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, horizonY);

    // 暮光光晕（缓慢呼吸）
    const glowA = 0.12 + 0.08 * Math.sin(t * 0.4);
    const gg = ctx.createRadialGradient(W * 0.5, horizonY * 0.9, 10, W * 0.5, horizonY * 0.9, W * 0.75);
    gg.addColorStop(0, 'rgba(255,180,110,' + (glowA * (1 - Math.abs(ph - 0.45) * 1.4)).toFixed(3) + ')');
    gg.addColorStop(1, 'rgba(255,180,110,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(0, 0, W, horizonY);
  }

  // ---- 星星 ----
  function drawStars(ph) {
    const alpha = Math.max(0, Math.min(1, (ph - 0.68) / 0.25));
    if (alpha <= 0) return;
    for (const s of stars) {
      const a = alpha * (0.5 + 0.5 * Math.sin(t * s.sp + s.tw));
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,240,' + a.toFixed(3) + ')';
      ctx.fill();
    }
  }

  // ---- 云 ----
  function drawClouds(ph, horizonY, dt) {
    for (const c of clouds) {
      c.x += (c.drift * c.sp * dt) / W;
      if (c.x < -0.3) c.x = 1.3;
      if (c.x > 1.3) c.x = -0.3;
      const cx = c.x * W;
      const cy = c.y * H;
      const a = c.o * (1 - Math.max(0, (ph - 0.85)) * 1.5);
      if (a <= 0.02) continue;
      const warm = ph > 0.25 && ph < 0.80;
      ctx.fillStyle = warm
        ? 'rgba(255,' + Math.round(170 + 85 * (0.8 - ph)) + ',120,' + a.toFixed(3) + ')'
        : 'rgba(255,255,255,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(cx, cy, c.w * 0.5, c.w * 0.14, 0, 0, Math.PI * 2);
      ctx.ellipse(cx - c.w * 0.22, cy + c.w * 0.05, c.w * 0.28, c.w * 0.1, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + c.w * 0.22, cy + c.w * 0.05, c.w * 0.3, c.w * 0.11, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- 太阳 ----
  function drawSun(ph, horizonY, v) {
    const startY = H * 0.16;
    const endY = horizonY + 55;
    const sunY = startY + ph * (endY - startY);
    const sunX = W * v.sunX;
    const r = Math.min(W, H) * 0.05 * Math.max(0.75, v.zoom * 0.8);

    const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, r * 5.5);
    glow.addColorStop(0, 'rgba(255,200,100,0.5)');
    glow.addColorStop(1, 'rgba(255,160,60,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sunX, sunY, r * 5.5, 0, Math.PI * 2); ctx.fill();

    const body = ctx.createRadialGradient(sunX - r * 0.2, sunY - r * 0.2, r * 0.1, sunX, sunY, r);
    body.addColorStop(0, '#fff8dc');
    body.addColorStop(0.6, '#ffe28a');
    body.addColorStop(1, '#ff9d3d');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(sunX, sunY, r, 0, Math.PI * 2); ctx.fill();

    return { sunX, sunY, r };
  }

  // ---- 远山剪影 ----
  function drawMountains(horizonY, ph) {
    const dark = 0.75 + Math.max(0, (ph - 0.5)) * 0.2;
    ctx.fillStyle = 'rgba(18,22,46,' + dark.toFixed(2) + ')';
    ctx.beginPath();
    ctx.moveTo(0, horizonY + 2);
    for (let x = 0; x <= W; x += 6) {
      const y = horizonY - Math.sin(x * 0.0035 + 1.2) * 24 - Math.sin(x * 0.011) * 10;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, horizonY + 60);
    ctx.lineTo(0, horizonY + 60);
    ctx.closePath();
    ctx.fill();
  }

  // ---- 海面（多层波浪 + 波纹） ----
  function drawSea(ph, horizonY, waterLine, v) {
    const zoom = v.zoom;
    const seaH = waterLine - horizonY;
    if (seaH <= 0) return;

    // 底色（随日落渐变，近深远亮）—— seaColor 返回 hex，mixHex 现支持 rgb 也安全
    const baseColor = seaColor(ph);
    const g = ctx.createLinearGradient(0, horizonY, 0, waterLine);
    g.addColorStop(0, mixHex(baseColor, '#ffffff', 0.25));
    g.addColorStop(0.45, baseColor);
    g.addColorStop(1, mixHex(baseColor, '#0a1230', 0.35));
    ctx.fillStyle = g;
    ctx.fillRect(0, horizonY, W, seaH);

    // 海天交界浪线（大幅起伏）
    ctx.beginPath();
    ctx.moveTo(0, horizonY + 2);
    for (let x = 0; x <= W; x += 4) {
      ctx.lineTo(x, horizonY + 2 + waveY(x, t, 8 * zoom, 0.030, 2.6, 2, 0) + 3);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.30)';
    ctx.lineWidth = 2.2;
    ctx.stroke();

    // 多层波纹带（横向波动的亮纹）
    const bands = 5;
    for (let b = 1; b <= bands; b++) {
      const baseY = horizonY + seaH * (b / (bands + 1));
      const amp = (4 + b * 2.2) * zoom;
      const freq = 0.018 + b * 0.009;
      const spd = 1.8 + b * 0.7;
      ctx.beginPath();
      ctx.moveTo(0, baseY);
      for (let x = 0; x <= W; x += 4) {
        ctx.lineTo(x, baseY + waveY(x, t, amp, freq, spd, 2, b));
      }
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.24 - b * 0.04).toFixed(2) + ')';
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }

    // 靠近水线的浪涌（大幅起伏的白色浪带）
    ctx.beginPath();
    ctx.moveTo(0, waterLine);
    for (let x = 0; x <= W; x += 4) {
      const w = waveY(x, t, 9 * zoom, 0.038, 3.2, 2, 1.5);
      ctx.lineTo(x, waterLine - Math.max(0, w) * 0.6 - 3);
    }
    ctx.lineTo(W, waterLine);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.24)';
    ctx.fill();
  }

  function seaColor(ph) {
    const stops = [
      [0.00, '#3d8fc4'],
      [0.22, '#3a7fb8'],
      [0.45, '#c25a3a'],
      [0.70, '#6a3a4a'],
      [1.00, '#101c38'],
    ];
    for (let i = 0; i < stops.length - 1; i++) {
      const [p1, c1] = stops[i], [p2, c2] = stops[i + 1];
      if (ph >= p1 && ph <= p2) return mixHex(c1, c2, (ph - p1) / (p2 - p1));
    }
    return stops[stops.length - 1][1];
  }

  // ---- 太阳倒影（海面光柱） ----
  function drawSunReflection(ph, sunX, horizonY, waterLine, v) {
    const a = Math.sin(ph * Math.PI) * 0.55;
    if (a <= 0.02) return;
    const seaH = waterLine - horizonY;
    if (seaH <= 0) return;
    const sx = sunX;
    const seg = 18;
    for (let i = 0; i < seg; i++) {
      const k = i / seg;
      const y = horizonY + k * seaH;
      const wob = Math.sin(t * 3 + i * 0.8) * 3 * (1 - k * 0.5);
      const halfW = (6 + k * 22) * Math.max(0.6, v.zoom * 0.7);
      const g = ctx.createLinearGradient(sx - halfW, y, sx + halfW, y);
      g.addColorStop(0, 'rgba(255,180,90,0)');
      g.addColorStop(0.5, 'rgba(255,190,100,' + (a * (1 - k * 0.6)).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,180,90,0)');
      ctx.fillStyle = g;
      ctx.fillRect(sx - halfW, y - 1, halfW * 2, 2);
    }
  }

  // ---- 沙滩 ----
  function drawBeach(ph, waterLine) {
    const h = H - waterLine;
    if (h <= 0) return;
    const dark = Math.max(0, (ph - 0.6) / 0.4) * 0.6;
    const g = ctx.createLinearGradient(0, waterLine, 0, H);
    g.addColorStop(0, mixHex('#e8c98a', '#5a4a3a', dark));
    g.addColorStop(1, mixHex('#c9a86a', '#3a3028', dark));
    ctx.fillStyle = g;
    ctx.fillRect(0, waterLine, W, h);

    // 湿沙带
    const wetH = Math.min(34, h * 0.45);
    const wg = ctx.createLinearGradient(0, waterLine, 0, waterLine + wetH);
    wg.addColorStop(0, 'rgba(190,150,105,0.55)');
    wg.addColorStop(1, 'rgba(190,150,105,0)');
    ctx.fillStyle = wg;
    ctx.fillRect(0, waterLine, W, wetH);

    // 沙纹（轻微浮动）
    ctx.strokeStyle = 'rgba(120,90,60,' + (0.12 * (1 - dark)).toFixed(2) + ')';
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
      const y = waterLine + ((i + 1) / 7) * h + Math.sin(t * 0.5 + i) * 2;
      ctx.beginPath();
      ctx.moveTo(0, y);
      for (let x = 0; x <= W; x += 8) {
        ctx.lineTo(x, y + Math.sin(x * 0.02 + i * 2) * 2);
      }
      ctx.stroke();
    }
  }

  // ---- 拍岸泡沫（粒子） ----
  function updateFoam(dt, waterLine, v) {
    if (foams.length < 80 && Math.random() < 0.6) {
      foams.push({
        x: Math.random() * W,
        y: waterLine + Math.random() * 8,
        vx: (Math.random() - 0.5) * 45,
        vy: -12 - Math.random() * 24,
        r: 1.5 + Math.random() * 3.5,
        life: 1,
        decay: 0.35 + Math.random() * 0.8
      });
    }
    for (let i = foams.length - 1; i >= 0; i--) {
      const f = foams[i];
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.vy += 24 * dt;
      f.life -= f.decay * dt;
      if (f.life <= 0 || f.y > waterLine + 45) foams.splice(i, 1);
    }
    for (const f of foams) {
      ctx.fillStyle = 'rgba(255,255,255,' + (Math.max(0, f.life) * 0.6).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (0.5 + f.life * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- 海面波光 ----
  function drawSparkles(ph, horizonY, waterLine, sunX) {
    const glow = Math.sin(ph * Math.PI) * 0.9;
    if (glow <= 0.03) return;
    const seaH = waterLine - horizonY;
    if (seaH <= 0) return;
    for (const s of sparks) {
      const sx = s.x * W;
      const sy = horizonY + s.y * seaH;
      const tw = 0.3 + 0.7 * Math.abs(Math.sin(t * 2 + s.ph));
      const dist = Math.abs(sx - sunX) / W;
      const bright = Math.max(0, 1 - dist * 2.5);
      const a = glow * tw * 0.6 * bright;
      if (a <= 0.01) continue;
      ctx.fillStyle = 'rgba(255,220,150,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(sx, sy, s.s * 2.5, s.s * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- 飞鸟 ----
  function drawBirds(ph, horizonY, dt) {
    const visible = 1 - Math.max(0, (ph - 0.75)) * 4;
    if (visible <= 0) return;
    ctx.strokeStyle = 'rgba(30,25,30,' + (0.8 * visible).toFixed(2) + ')';
    ctx.lineWidth = 1.6;
    for (const b of birds) {
      b.x += (b.sp * dt) / W;
      if (b.x > 1.15) b.x = -0.15;
      const x = b.x * W;
      const y = b.y * H + Math.sin(t * 0.5 + b.ph) * 12;
      const flap = Math.sin(t * b.fr + b.ph) * b.amp;
      ctx.beginPath();
      ctx.moveTo(x - 10 * b.s, y);
      ctx.quadraticCurveTo(x - 5 * b.s, y - flap, x, y);
      ctx.quadraticCurveTo(x + 5 * b.s, y - flap, x + 10 * b.s, y);
      ctx.stroke();
    }
  }

  // ---- 点击涟漪 ----
  function drawRipples(dt) {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i];
      rp.r += (rp.max - rp.r) * Math.min(1, dt * 3.5);
      rp.a -= dt * 1.2;
      if (rp.a <= 0) { ripples.splice(i, 1); continue; }
      ctx.strokeStyle = 'rgba(255,255,255,' + Math.max(0, rp.a).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,210,130,' + (Math.max(0, rp.a) * 0.6).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r * 0.7, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // ---- 信息面板 ----
  function updatePanel(ph, tide, v) {
    elSun.textContent = Math.round((1 - ph) * 90) + '°';
    elTide.textContent = tideLabel(tide);
    elLevel.textContent = Math.round(tide * 100) + '%';
    elView.textContent = '📷 ' + v.name;
  }

  /* ================= 主循环 ================= */
  let last = performance.now();
  function frame(now) {
    // 单帧出错也不允许中断动画循环 —— 保证"永远动起来"
    try {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      t += dt * speed;

      // 视角平滑过渡
      viewT += (viewIndex - viewT) * Math.min(1, dt * 2.5);
      const v = currentView();

      const ph = sunPhase();
      const tide = tideLevel();

      // 摄像机轻微晃动（近景更明显）
      const bob = Math.sin(t * 0.35) * v.bob * 0.5;
      const horizonY = H * v.horizon + bob;
      const beachTop = H * (v.horizon + v.beachF) + bob;
      const waterLine = beachTop + tide * (H - beachTop) * 0.9;

      // 1. 天空
      drawSky(ph, horizonY);
      // 2. 星星
      drawStars(ph);
      // 3. 云
      drawClouds(ph, horizonY, dt);
      // 4. 太阳
      const sun = drawSun(ph, horizonY, v);
      // 5. 远山
      drawMountains(horizonY, ph);
      // 6. 海面
      drawSea(ph, horizonY, waterLine, v);
      // 7. 太阳倒影
      drawSunReflection(ph, sun.sunX, horizonY, waterLine, v);
      // 8. 沙滩
      drawBeach(ph, waterLine);
      // 9. 拍岸泡沫
      updateFoam(dt, waterLine, v);
      // 10. 波光
      drawSparkles(ph, horizonY, waterLine, sun.sunX);
      // 11. 飞鸟
      drawBirds(ph, horizonY, dt);
      // 12. 点击涟漪
      drawRipples(dt);
      // 13. 面板
      updatePanel(ph, tide, v);
    } catch (err) {
      console.error('frame error:', err);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
