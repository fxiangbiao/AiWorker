<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>黑洞 · 吞噬群星</title>
<style>
:root{ --accent:#ffb86b; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:fixed;top:0;left:0;display:block}
#bg{ z-index:0 }
#main{ z-index:1 }
#vignette{ position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
#title{ position:fixed;top:18px;left:22px;z-index:3;pointer-events:none;color:#fff }
#title h1{font-size:22px;font-weight:600;letter-spacing:4px;text-shadow:0 0 18px rgba(255,184,107,.8)}
#title p{font-size:11px;color:rgba(255,255,255,.45);margin-top:4px;letter-spacing:3px}
#ui{ position:fixed;top:16px;right:16px;z-index:3;width:214px;background:rgba(8,10,18,.72);
  border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:14px 16px;color:rgba(255,255,255,.85);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px); box-shadow:0 8px 30px rgba(0,0,0,.6)}
#ui h2{font-size:13px;font-weight:500;letter-spacing:2px;margin-bottom:12px;color:var(--accent)}
.row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.row label{font-size:11px;color:rgba(255,255,255,.55);display:flex;justify-content:space-between}
.row label b{color:var(--accent);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.15);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 10px rgba(255,184,107,.8)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
.toggle{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.55);margin-bottom:8px;cursor:pointer}
.switch{width:34px;height:18px;border-radius:9px;background:rgba(255,255,255,.15);position:relative;transition:.25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.25s}
.toggle.on .switch{background:var(--accent)}
.toggle.on .switch::after{left:18px}
#stats{position:fixed;bottom:16px;left:22px;z-index:3;font-size:12px;color:rgba(255,255,255,.5);letter-spacing:1px;pointer-events:none}
#stats b{color:var(--accent)}
.hint{position:fixed;bottom:16px;right:22px;z-index:3;font-size:11px;color:rgba(255,255,255,.35);letter-spacing:1px;pointer-events:none}
@media (max-width:680px){
  #ui{width:168px;padding:10px 12px;top:10px;right:10px}
  #title{top:10px;left:12px}
  #title h1{font-size:15px}
  #title p{font-size:9px}
  .hint{display:none}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="main"></canvas>
<div id="vignette"></div>

<div id="title"><h1>黑洞 · 吞噬群星</h1><p>BLACK HOLE DEVOURING STARS</p></div>

<div id="ui">
  <h2>⚫ 控制面板</h2>
  <div class="row"><label>引力强度 <b id="v-gm">2.3</b></label><input type="range" id="gm" min="1" max="20" step="0.1" value="6"></div>
  <div class="row"><label>星群密度 <b id="v-sc">90</b></label><input type="range" id="sc" min="20" max="220" step="5" value="90"></div>
  <div class="row"><label>时间流速 <b id="v-sp">1.00×</b></label><input type="range" id="sp" min="0.1" max="2.5" step="0.05" value="1"></div>
  <div class="toggle on" id="t-mouse"><span>跟随鼠标</span><div class="switch"></div></div>
  <div class="toggle on" id="t-disk"><span>吸积盘</span><div class="switch"></div></div>
</div>

<div id="stats">已吞噬 <b id="s-eat">0</b> 颗 · 现存 <b id="s-live">0</b> 颗 · <b id="s-fps">60</b> FPS</div>
<div class="hint">✦ 移动鼠标 / 手指，牵引黑洞吞噬星群</div>

<script>
"use strict";
/* ================= 画布基础 ================= */
const bgC = document.getElementById('bg'), bgX = bgC.getContext('2d');
const mc  = document.getElementById('main'), ctx = mc.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  [bgC, mc].forEach(c => {
    c.width  = Math.round(W * DPR); c.height = Math.round(H * DPR);
    c.style.width = W + 'px';       c.style.height = H + 'px';
    c.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
  });
  buildBackdrop();
  BH.x = BH.tx = W / 2; BH.y = BH.ty = H / 2;
}
window.addEventListener('resize', resize);

/* ================= 设置 ================= */
const S = { gm: 0, starMax: 90, speed: 1, followMouse: true, disk: true };
const $ = id => document.getElementById(id);

function applyGM(v){
  S.gm = 1e6 * Math.pow(10, (v / 20) * 1.2);           // 1.15e6 ~ 1e7
  $('v-gm').textContent = (S.gm / 1e6).toFixed(1);
}
$('gm').oninput = e => applyGM(+e.target.value);
$('sc').oninput = e => { S.starMax = +e.target.value; $('v-sc').textContent = e.target.value; };
$('sp').oninput = e => { S.speed = +e.target.value; $('v-sp').textContent = (+e.target.value).toFixed(2) + '×'; };
function bindToggle(id, cb){ const el = $(id); el.onclick = () => { el.classList.toggle('on'); cb(el.classList.contains('on')); }; }
bindToggle('t-mouse', v => S.followMouse = v);
bindToggle('t-disk',  v => S.disk = v);
applyGM(6);

/* ================= 黑洞 ================= */
const BH = { x: 0, y: 0, tx: 0, ty: 0, rh: 26 };
window.addEventListener('mousemove', e => { BH.tx = e.clientX; BH.ty = e.clientY; });
window.addEventListener('touchmove', e => { const t = e.touches[0]; BH.tx = t.clientX; BH.ty = t.clientY; }, { passive: true });

/* ================= 背景星野 ================= */
let BStars = [];
function buildBackdrop(){
  const n = Math.floor(W * H / 9000);
  BStars = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.1 + 0.3,
    p: Math.random() * Math.PI * 2, s: 0.5 + Math.random() * 2.2,
    hue: Math.random() < 0.8 ? 0 : (Math.random() < 0.5 ? 210 : 40),
  }));
}

/* ================= 吸积盘 ================= */
let Disk = [];
function buildDisk(){
  Disk = [];
  const n = 760;
  for (let i = 0; i < n; i++){
    const r = BH.rh * (1.35 + Math.pow(Math.random(), 1.4) * 7.5);   // 内密外疏
    Disk.push({
      r, th: Math.random() * Math.PI * 2,
      w: Math.sqrt(S.gm / r / r / r) * (0.85 + Math.random() * 0.35),
      sz: 0.6 + Math.random() * 1.6,
      b: 0.35 + Math.random() * 0.65,
    });
  }
}
let diskOmegaCache = 0;
function ensureDiskOmega(){
  if (Math.abs(diskOmegaCache - S.gm) > S.gm * 0.02){
    for (const p of Disk) p.w = Math.sqrt(S.gm / p.r / p.r / p.r) * (0.85 + Math.random() * 0.35);
    diskOmegaCache = S.gm;
  }
}

/* ================= 被吞噬的星 ================= */
const STAR_COLORS = ['#ffffff','#dceaff','#fff6d8','#ffd9a0','#9fd8ff','#ffb08a'];
let Stars = [], Flashes = [], eaten = 0, spawnTimer = 0;

function spawnStar(){
  const a = Math.random() * Math.PI * 2;
  const r = BH.rh * 6 + Math.random() * Math.max(W, H) * 0.45;
  const x = BH.x + Math.cos(a) * r, y = BH.y + Math.sin(a) * r;
  // 切向初速度（略低于开普勒速度），使其被捕获并螺旋下落
  const v = Math.sqrt(S.gm / r) * 0.8 * (0.85 + Math.random() * 0.3);
  const tx = -Math.sin(a), ty = Math.cos(a);
  Stars.push({
    x, y,
    vx: tx * v + (Math.random() - 0.5) * 10,
    vy: ty * v + (Math.random() - 0.5) * 10,
    size: 1 + Math.random() * 1.8,
    color: STAR_COLORS[(Math.random() * STAR_COLORS.length) | 0],
    pulse: Math.random() * Math.PI * 2,
  });
}

function consume(s){
  eaten++;
  const dx = s.x - BH.x, dy = s.y - BH.y;
  const d = Math.hypot(dx, dy) || 1;
  const ex = BH.x + dx / d * BH.rh, ey = BH.y + dy / d * BH.rh;   // 在视界边缘爆闪
  const n = 6 + ((Math.random() * 6) | 0);
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = 20 + Math.random() * 130;
    Flashes.push({ x: ex, y: ey, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.6 + Math.random() * 0.7, max: 1.3, size: 1 + Math.random() * 2.5, color: s.color });
  }
  Flashes.push({ x: ex, y: ey, vx: 0, vy: 0, life: 0.45, max: 0.45, size: BH.rh * 1.05, color: '#fff' }); // 冲击环
}

/* ================= 更新 ================= */
function update(dt){
  // 黑洞跟随目标
  const k = Math.min(1, 4.5 * dt);
  if (S.followMouse){ BH.x += (BH.tx - BH.x) * k; BH.y += (BH.ty - BH.y) * k; }
  else              { BH.x += (W/2 - BH.x) * k;   BH.y += (H/2 - BH.y) * k;   }
  ensureDiskOmega();

  // 生成星
  spawnTimer -= dt;
  if (spawnTimer <= 0 && Stars.length < S.starMax){
    spawnStar();
    spawnTimer = 0.12 + Math.random() * 0.4;
  }
  while (Stars.length < S.starMax && Math.random() < 0.25) spawnStar(); // 调高密度时快速补满

  // 星体引力物理（带能量耗散 → 螺旋内落）
  const GM = S.gm, soft2 = 64, rh = BH.rh, drag = 1 - Math.min(0.5, 0.16 * dt);
  for (let i = Stars.length - 1; i >= 0; i--){
    const s = Stars[i];
    const dx = BH.x - s.x, dy = BH.y - s.y;
    const r2 = dx * dx + dy * dy + soft2, r = Math.sqrt(r2);
    const a = GM / r2;
    s.vx += dx / r * a * dt;  s.vy += dy / r * a * dt;
    s.vx *= drag;             s.vy *= drag;
    s.x += s.vx * dt;         s.y += s.vy * dt;
    if ((s.x - BH.x) * (s.x - BH.x) + (s.y - BH.y) * (s.y - BH.y) < rh * rh * 0.7){
      consume(s);
      Stars.splice(i, 1);
    }
  }

  // 盘粒子公转（随黑洞平移）
  for (const p of Disk){
    p.th += p.w * dt;
    if (p.th > Math.PI * 2) p.th -= Math.PI * 2;
  }

  // 闪光
  for (let i = Flashes.length - 1; i >= 0; i--){
    const f = Flashes[i];
    f.life -= dt;
    if (f.life <= 0){ Flashes.splice(i, 1); continue; }
    f.vx *= (1 - 2.5 * dt); f.vy *= (1 - 2.5 * dt);
    f.x += f.vx * dt;       f.y += f.vy * dt;
    f.size += 6 * dt;
  }

  // 统计
  $('s-eat').textContent = eaten;
  $('s-live').textContent = Stars.length;
}

/* ================= 绘制 ================= */
const TAU = Math.PI * 2;

function drawBg(t){
  bgX.globalCompositeOperation = 'source-over';
  bgX.fillStyle = '#020308';
  bgX.fillRect(0, 0, W, H);
  // 星云底色
  const g = bgX.createRadialGradient(W * 0.5, H * 0.42, 10, W * 0.5, H * 0.42, Math.max(W, H) * 0.55);
  g.addColorStop(0, 'rgba(58,42,110,0.20)');
  g.addColorStop(0.5, 'rgba(24,18,60,0.12)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  bgX.fillStyle = g; bgX.fillRect(0, 0, W, H);
  // 闪烁星星
  bgX.globalCompositeOperation = 'lighter';
  for (const st of BStars){
    const tw = 0.45 + 0.55 * Math.sin(t * st.s + st.p);
    bgX.globalAlpha = tw * 0.9;
    bgX.fillStyle = st.hue === 0 ? '#ffffff' : st.hue === 210 ? '#bcd8ff' : '#ffe9c9';
    bgX.beginPath(); bgX.arc(st.x, st.y, st.r, 0, TAU); bgX.fill();
  }
  bgX.globalAlpha = 1;
}

function drawMain(t){
  // 1) 尾迹淡出
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(2,3,8,0.30)';
  ctx.fillRect(0, 0, W, H);

  // 2) 在黑洞处挖洞，清除移动残留的尾迹
  ctx.globalCompositeOperation = 'destination-out';
  const er = BH.rh * 2.6;
  const eg = ctx.createRadialGradient(BH.x, BH.y, 0, BH.x, BH.y, er);
  eg.addColorStop(0, 'rgba(0,0,0,1)');
  eg.addColorStop(0.55, 'rgba(0,0,0,0.9)');
  eg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(BH.x, BH.y, er, 0, TAU); ctx.fill();

  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 1;

  // 3) 引力透镜光晕
  const halo = ctx.createRadialGradient(BH.x, BH.y, BH.rh * 0.6, BH.x, BH.y, BH.rh * 2.4);
  halo.addColorStop(0, 'rgba(255,240,200,0.5)');
  halo.addColorStop(0.4, 'rgba(255,180,100,0.15)');
  halo.addColorStop(1, 'rgba(255,120,40,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(BH.x, BH.y, BH.rh * 2.4, 0, TAU); ctx.fill();

  // 4) 吸积盘光晕带
  if (S.disk){
    const dg = ctx.createRadialGradient(BH.x, BH.y, BH.rh * 1.15, BH.x, BH.y, BH.rh * 9);
    dg.addColorStop(0, 'rgba(255,255,255,0.28)');
    dg.addColorStop(0.25, 'rgba(255,210,150,0.16)');
    dg.addColorStop(0.6, 'rgba(255,140,70,0.08)');
    dg.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = dg;
    ctx.beginPath(); ctx.arc(BH.x, BH.y, BH.rh * 9, 0, TAU); ctx.fill();

    // 5) 盘粒子（配合尾迹形成高速光丝）
    for (const p of Disk){
      const px = BH.x + Math.cos(p.th) * p.r;
      const py = BH.y + Math.sin(p.th) * p.r;
      const vx = -Math.sin(p.th) * p.w * p.r, vy = Math.cos(p.th) * p.w * p.r;
      const dir = vx * px > 0 ? 1 : 0.75;                       // 简化多普勒效应
      const heat = 1 - (p.r - BH.rh) / (BH.rh * 8);
      ctx.fillStyle = heat > 0.6 ? `rgba(255,244,214,${(0.5 * p.b * dir).toFixed(3)})`
                    : heat > 0.3 ? `rgba(255,196,120,${(0.5 * p.b * dir).toFixed(3)})`
                    :              `rgba(255,140,70,${(0.4 * p.b * dir).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(px, py, p.sz, 0, TAU); ctx.fill();
    }
  }

  // 6) 光子环（爱因斯坦环 / 引力透镜）
  const rr = BH.rh * 1.55;
  const ring = ctx.createRadialGradient(BH.x, BH.y, rr - 6, BH.x, BH.y, rr + 6);
  ring.addColorStop(0, 'rgba(255,180,90,0)');
  ring.addColorStop(0.5, 'rgba(255,230,180,0.75)');
  ring.addColorStop(1, 'rgba(255,180,90,0)');
  ctx.fillStyle = ring;
  ctx.beginPath(); ctx.arc(BH.x, BH.y, rr, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,245,220,0.5)';
  ctx.lineWidth = 2;
  ctx.setLineDash([BH.rh * 0.9, BH.rh * 2.2]);
  ctx.lineDashOffset = -t * 140;
  ctx.beginPath(); ctx.arc(BH.x, BH.y, rr, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);

  // 7) 事件视界（纯黑圆盘）
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(BH.x, BH.y, BH.rh, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255,220,160,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(BH.x, BH.y, BH.rh * 1.02, 0, TAU); ctx.stroke();

  // 8) 被吞噬的星（光晕 + 核心）
  for (const s of Stars){
    const pulse = 0.85 + 0.15 * Math.sin(t * 3 + s.pulse);
    const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 5);
    glow.addColorStop(0, hexToRgba(s.color, 0.75 * pulse));
    glow.addColorStop(1, hexToRgba(s.color, 0));
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size * 5, 0, TAU); ctx.fill();
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size * pulse, 0, TAU); ctx.fill();
  }

  // 9) 吞噬爆闪
  for (const f of Flashes){
    const a = Math.max(0, f.life / f.max);
    const glow = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size * 2);
    glow.addColorStop(0, hexToRgba(f.color, a));
    glow.addColorStop(1, hexToRgba(f.color, 0));
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.size * 2, 0, TAU); ctx.fill();
    ctx.globalAlpha = a;
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(1, f.size * 0.5), 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* 颜色缓存，避免每帧生成字符串 */
const _rgbaCache = {};
function hexToRgba(hex, a){
  const key = hex + a.toFixed(3);
  let c = _rgbaCache[key];
  if (c) return c;
  const n = parseInt(hex.slice(1), 16);
  c = `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${Math.max(0, Math.min(1, a)).toFixed(3)})`;
  _rgbaCache[key] = c;
  return c;
}

/* ================= 主循环 ================= */
let last = performance.now(), fps = 0, fpsT = 0, frames = 0;

function loop(now){
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt * S.speed);
  drawBg(now / 1000);
  drawMain(now / 1000);
  frames++; fpsT += dt;
  if (fpsT >= 0.5){ fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; $('s-fps').textContent = fps; }
  requestAnimationFrame(loop);
}

resize();
buildDisk();
for (let i = 0; i < Math.min(30, S.starMax); i++) spawnStar();
requestAnimationFrame(loop);
</script>
</body>
</html>
